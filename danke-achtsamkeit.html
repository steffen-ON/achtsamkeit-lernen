<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke – Achtsamkeit & Meditation Lernen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sage:  #7A9E87;
      --amber: #C8894A;
      --stone: #2E2A25;
      --linen: #F5F0E8;
      --paper: #FDFAF5;
      --mist:  #DDD8CF;
    }
    body {
      background: var(--paper);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: var(--stone);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      text-align: center;
      max-width: 480px;
      padding: 3rem 2rem;
    }
    .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: breathe 4s ease-in-out infinite;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem; font-weight: 400;
      color: var(--stone); margin-bottom: 1rem;
      line-height: 1.2;
    }
    h1 em { font-style: italic; color: var(--amber); }
    p {
      font-size: 0.95rem; line-height: 1.8;
      opacity: 0.6; margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.8rem 2rem; border-radius: 2rem;
      background: var(--sage); color: var(--paper);
      text-decoration: none; font-size: 0.88rem;
      transition: background 0.25s;
    }
    a:hover { background: var(--stone); }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🌿</span>
    <h1>Danke —<br>ich melde mich <em>bald.</em></h1>
    <p>Schön dass du dabei bist. Du bekommst von mir alle weiteren Infos zu Terminen und Ablauf.</p>
    <a href="/">Zurück zur Seite</a>
  </div>
</body>
</html>
